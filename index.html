<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live Incident Map</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        #status {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 10px 14px;
            border-radius: 6px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.35);
            font-size: 14px;
            line-height: 1.5;
            max-width: calc(100vw - 100px);
            overflow-wrap: anywhere;
        }

        .status-controls {
            margin-top: 6px;
        }

        .status-controls label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .incident-marker {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #333;
            box-sizing: content-box;
            box-shadow: 0 0 4px rgba(0,0,0,0.65);
        }

        .marker-av {
            background: #ffffff;
            border-color: #555555;
        }

        .marker-fire {
            background: #e31b23;
            border-color: #8b0000;
        }

        .marker-ses {
            background: #ff8c00;
            border-color: #a65300;
        }

        .status-assigned {
            outline: 4px solid #1677ff;
            outline-offset: 2px;
        }

        .status-onscene {
            outline: 4px solid #16a34a;
            outline-offset: 2px;
        }

        .map-legend {
            position: absolute;
            bottom: 25px;
            left: 10px;
            z-index: 1000;
            background: white;
            padding: 10px 12px;
            border-radius: 6px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.35);
            font-size: 13px;
            line-height: 1.8;
        }

        .legend-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #555;
            margin-right: 7px;
            vertical-align: -2px;
        }

        .legend-av {
            background: #ffffff;
        }

        .legend-fire {
            background: #e31b23;
            border-color: #8b0000;
        }

        .legend-ses {
            background: #ff8c00;
            border-color: #a65300;
        }

        .legend-status {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 3px solid;
            margin-right: 7px;
            vertical-align: -3px;
        }

        .legend-assigned {
            border-color: #1677ff;
        }

        .legend-onscene {
            border-color: #16a34a;
        }

        .popup-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .popup-row {
            margin: 3px 0;
        }
    </style>
</head>

<body>
    <div id="status">
        <strong>Live Incident Map</strong><br>
        Connecting to Matrix…
        <div class="status-controls">
            <label>
                <input id="showCleared" type="checkbox">
                Show cleared jobs
            </label>
        </div>
    </div>

    <div class="map-legend">
        <strong>Agency</strong><br>
        <span class="legend-dot legend-av"></span>AV<br>
        <span class="legend-dot legend-fire"></span>Fire<br>
        <span class="legend-dot legend-ses"></span>SES
        <hr>
        <strong>Status</strong><br>
        <span class="legend-status legend-assigned"></span>Assigned<br>
        <span class="legend-status legend-onscene"></span>On scene
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
    (() => {
        const WORKER_URL =
            "https://matrix-live-jobs.matt-cullen.workers.dev/api/jobs";

        const STATUS_URL =
            "https://mattc-rgb.github.io/incident-map/job-status.json";

        const params = new URLSearchParams(window.location.search);
        const agency = (params.get("agency") || "").toLowerCase();

        const agencyNames = {
            av: "AV",
            fire: "Fire",
            ses: "SES"
        };

        const agencyName = agencyNames[agency] || "All agencies";
        const statusBox = document.getElementById("status");
        const showClearedCheckbox = document.getElementById("showCleared");

        const map = L.map("map").setView([-36.8, 144.5], 7);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        const incidentLayer = L.layerGroup().addTo(map);

        let firstLoad = true;
        let isLoading = false;
        let showCleared = false;
        let jobStatuses = {};

        showClearedCheckbox.addEventListener("change", () => {
            showCleared = showClearedCheckbox.checked;
            loadJobs();
        });

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function matchesAgency(job) {
            const id = String(job.id || "").toUpperCase();

            if (agency === "av") {
                return ["J", "E", "Z"].some(prefix => id.startsWith(prefix));
            }

            if (agency === "fire") {
                return id.startsWith("F");
            }

            if (agency === "ses") {
                return id.startsWith("S");
            }

            return true;
        }

        function getMarkerClass(job) {
            const id = String(job.id || "").toUpperCase();

            if (id.startsWith("F")) {
                return "marker-fire";
            }

            if (id.startsWith("S")) {
                return "marker-ses";
            }

            return "marker-av";
        }

        function getJobStatus(job) {
            return String(jobStatuses[String(job.id || "").toUpperCase()] || "Open");
        }

        function getStatusClass(status) {
            const normalized = String(status || "").toLowerCase();

            if (normalized === "assigned") {
                return "status-assigned";
            }

            if (normalized === "onscene" || normalized === "on scene") {
                return "status-onscene";
            }

            return "";
        }

        function makePopup(job, status) {
            return `
                <div class="popup-title">
                    ${escapeHtml(job.id || "Unknown incident")}
                </div>
                <div class="popup-row">
                    <strong>Status:</strong>
                    ${escapeHtml(status)}
                </div>
                <div class="popup-row">
                    <strong>Type:</strong>
                    ${escapeHtml(job.type || job.typecode || "Unknown")}
                </div>
                <div class="popup-row">
                    <strong>Agency:</strong>
                    ${escapeHtml(job.agency || "Unknown")}
                </div>
                <div class="popup-row">
                    <strong>Area:</strong>
                    ${escapeHtml(job.area || "Unknown")}
                </div>
                <div class="popup-row">
                    <strong>Name:</strong>
                    ${escapeHtml(job.name || job.shortname || "Unknown")}
                </div>
                <div class="popup-row">
                    <strong>Address:</strong>
                    ${escapeHtml(job.address || "Unknown")}
                </div>
                <div class="popup-row">
                    <strong>Suburb:</strong>
                    ${escapeHtml(job.suburb || "Unknown")}
                </div>
            `;
        }

        async function loadJobStatuses() {
            try {
                const response = await fetch(STATUS_URL + "?_=" + Date.now(), {
                    method: "GET",
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error("HTTP " + response.status + " from status file");
                }

                const data = await response.json();
                const jobs = Array.isArray(data) ? data : data.jobs;

                if (!Array.isArray(jobs)) {
                    throw new Error("Status file does not contain a jobs array");
                }

                const newStatuses = {};

                jobs.forEach(item => {
                    const id = String(item.Job || item.job || item.id || "")
                        .trim()
                        .toUpperCase();

                    if (id) {
                        newStatuses[id] = String(item.Status || item.status || "Open");
                    }
                });

                jobStatuses = newStatuses;
            } catch (error) {
                console.error("Could not load job statuses:", error);
            }
        }

        async function loadJobs() {
            if (isLoading) return;
            isLoading = true;

            try {
                await loadJobStatuses();

                const requestUrl =
                    WORKER_URL +
                    "?agency=" + encodeURIComponent(agency) +
                    "&_=" + Date.now();

                const response = await fetch(requestUrl, {
                    method: "GET",
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error("HTTP " + response.status + " from Matrix Worker");
                }

                const data = await response.json();

                if (!Array.isArray(data)) {
                    throw new Error("Matrix response was not a JSON array");
                }

                const activeJobs = data.filter(job => {
                    const lat = Number(job.lat);
                    const lon = Number(job.lon);

                    return job.is_active === true &&
                        matchesAgency(job) &&
                        Number.isFinite(lat) &&
                        Number.isFinite(lon) &&
                        Math.abs(lat) <= 90 &&
                        Math.abs(lon) <= 180;
                });

                const jobs = activeJobs.filter(job => {
                    const status = getJobStatus(job);
                    return showCleared || status.toLowerCase() !== "clear";
                });

                incidentLayer.clearLayers();

                const markerBounds = [];

                jobs.forEach(job => {
                    const lat = Number(job.lat);
                    const lon = Number(job.lon);
                    const markerClass = getMarkerClass(job);
                    const status = getJobStatus(job);
                    const statusClass = getStatusClass(status);

                    const marker = L.marker([lat, lon], {
                        icon: L.divIcon({
                            className: "",
                            html: `<div class="incident-marker ${markerClass} ${statusClass}"></div>`,
                            iconSize: [26, 26],
                            iconAnchor: [13, 13]
                        })
                    });

                    marker.bindPopup(makePopup(job, status));
                    marker.addTo(incidentLayer);
                    markerBounds.push([lat, lon]);
                });

                if (firstLoad) {
                    if (markerBounds.length === 1) {
                        map.setView(markerBounds[0], 12);
                    } else if (markerBounds.length > 1) {
                        map.fitBounds(markerBounds, {
                            padding: [30, 30],
                            maxZoom: 13
                        });
                    }

                    firstLoad = false;
                }

                const updated = new Date().toLocaleTimeString("en-AU");

                statusBox.innerHTML =
                    "<strong>Live Incident Map</strong><br>" +
                    "Agency: " + escapeHtml(agencyName) + "<br>" +
                    "Active jobs: " + jobs.length + "<br>" +
                    "Last refreshed: " + escapeHtml(updated);

                const controls = document.createElement("div");
                controls.className = "status-controls";

                const label = document.createElement("label");
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = showCleared;
                checkbox.addEventListener("change", () => {
                    showCleared = checkbox.checked;
                    loadJobs();
                });

                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(" Show cleared jobs"));
                controls.appendChild(label);
                statusBox.appendChild(controls);

            } catch (error) {
                console.error("Failed to load Matrix jobs:", error);

                statusBox.innerHTML =
                    "<strong>Live Incident Map</strong><br>" +
                    "Agency: " + escapeHtml(agencyName) + "<br>" +
                    "<strong>Unable to refresh jobs</strong><br>" +
                    "Error: " + escapeHtml(error.message || String(error));
            } finally {
                isLoading = false;
            }
        }

        loadJobs();
        setInterval(loadJobs, 10000);
    })();
    </script>
</body>
</html>
