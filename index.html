<!DOCTYPE html>
<html>
<head>
    <title>Incident Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script>

var map = L.map('map').setView([-37.5, 145.0], 8);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '© OpenStreetMap'
    }
).addTo(map);

fetch('incidents.json')
.then(response => response.json())
.then(data => {

    data.forEach(function(incident) {

        var marker = L.marker([
            incident.lat,
            incident.lon
        ]).addTo(map);

        marker.bindPopup(
            '<b>' + incident.incident + '</b><br>' +
            incident.status + '<br>' +
            incident.address
        );

    });

})
.catch(error => {
    console.error('Error loading incidents:', error);
});

</script>

</body>
</html>
