
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kilmore Incident Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .popup-title {
            font-weight: bold;
            font-size: 16px;
        }

        .popup-type {
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .legend {
            background: white;
            padding: 10px;
            border: 1px solid black;
            line-height: 1.6;
        }

        .feed-status {
            position: absolute;
            top: 10px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 8px 12px;
            border-radius: 4px;
            box-shadow: 0 1px 5px #999;
            font: 13px Arial, sans-serif;
        }
    </style>
</head>

<body>

<div id="map"></div>
<div id="feedStatus" class="feed-status">Connecting to live feed…</div>

<script>
"use strict";

// Live Matrix feed via Cloudflare Worker
const WORKER_URL =
    "https://matrix-live-jobs.matt-cullen.workers.dev/api/jobs";

const params = new URLSearchParams(window.location.search);
const agencyFilter = (params.get("agency") || "").toLowerCase();

const map = L.map("map").setView([-37.5, 145.0], 8);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);

let firstLoad = true;
let requestInProgress = false;

const statusElement = document.getElementById("feedStatus");

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];
    });
}

function formatDate(value) {
    if (value === null || value === undefined || value === "") {
        return "";
    }

    // Matrix timestamps are Unix seconds, not milliseconds.
    const numberValue = Number(value);
    const date = Number.isFinite(numberValue)
        ? new Date(numberValue * 1000)
        : new Date(value);

    if (Number.isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleString("en-AU", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}

function getStatus(job) {
    if (job.is_active === true) return "open";
    return "clear";
}

function getColour(status) {
    if (status === "open") return "red";
    if (status === "enroute") return "orange";
    if (status === "onscene") return "green";
    return "gray";
}

function getAgencyLabel(agency) {
    return {
        av: "AV",
        fire: "Fire",
        ses: "SES"
    }[agency] || "All agencies";
}

const markerLayer = L.layerGroup().addTo(map);

function buildPopup(job) {
    const status = getStatus(job);

    return `
        <div class="popup-title">${escapeHtml(job.id || "No Incident ID")}</div>
        <div class="popup-type">${escapeHtml(job.type || "")}</div>
        <br>
        <b>Agency:</b> ${escapeHtml(job.agency || "")}<br>
        <b>Area:</b> ${escapeHtml(job.area || "")}<br>
        <b>Status:</b> ${escapeHtml(status)}<br>
        <b>Incident:</b> ${escapeHtml(job.name || "")}<br>
        <b>Address:</b><br>${escapeHtml(job.address || "")}<br>
        <b>Suburb:</b> ${escapeHtml(job.suburb || "")}<br><br>
        <b>Last seen:</b> ${escapeHtml(formatDate(job.last_seen))}<br>
        <b>Source updated:</b> ${escapeHtml(formatDate(job.source_updated))}
    `;
}

function matchesAgency(job) {
    if (!agencyFilter) return true;

    if (agencyFilter === "av") {
        // Match the same ID prefixes used in the Power Apps gallery.
        return ["J", "E", "Z"].some(prefix =>
            String(job.id || "").startsWith(prefix)
        );
    }

    if (agencyFilter === "fire") {
        return String(job.id || "").startsWith("F");
    }

    if (agencyFilter === "ses") {
        return String(job.id || "").startsWith("S");
    }

    // Unknown URL filters should not silently hide all jobs.
    return true;
}

async function refreshMap() {
    if (requestInProgress) return;

    requestInProgress = true;

    try {
        const response = await fetch(WORKER_URL, {
            method: "GET",
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Feed returned HTTP " + response.status);
        }

        const jobs = await response.json();

        if (!Array.isArray(jobs)) {
            throw new Error("Feed did not return a JSON array");
        }

        const filteredJobs = jobs.filter(job =>
            matchesAgency(job) &&
            job.is_active === true &&
            Number.isFinite(Number(job.lat)) &&
            Number.isFinite(Number(job.lon)) &&
            Number(job.lat) >= -90 &&
            Number(job.lat) <= 90 &&
            Number(job.lon) >= -180 &&
            Number(job.lon) <= 180
        );

        markerLayer.clearLayers();

        filteredJobs.forEach(job => {
            const status = getStatus(job);
            const marker = L.circleMarker(
                [Number(job.lat), Number(job.lon)],
                {
                    radius: 8,
                    fillColor: getColour(status),
                    color: "#000",
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8
                }
            );

            marker.bindPopup(buildPopup(job));
            marker.addTo(markerLayer);
        });

        statusElement.textContent =
            `${getAgencyLabel(agencyFilter)} · ${filteredJobs.length} active jobs · Updated ${new Date().toLocaleTimeString("en-AU")}`;

        if (firstLoad && filteredJobs.length > 0) {
            const bounds = markerLayer.getBounds();

            if (bounds.isValid()) {
                map.fitBounds(bounds, { padding: [30, 30], maxZoom: 13 });
            }

            firstLoad = false;
        }
    } catch (error) {
        console.error("Error loading Matrix feed:", error);
        statusElement.textContent =
            "Feed error — check connection or Worker settings";
    } finally {
        requestInProgress = false;
    }
}

const legend = L.control({ position: "bottomright" });

legend.onAdd = function() {
    const div = L.DomUtil.create("div", "legend");

    div.innerHTML =
        "<b>Incident status</b><br>" +
        "🔴 Active job<br>" +
        "<br><b>Agency filter</b><br>" +
        escapeHtml(getAgencyLabel(agencyFilter));

    return div;
};

legend.addTo(map);

refreshMap();
setInterval(refreshMap, 10000);
</script>

</body>
</html>
