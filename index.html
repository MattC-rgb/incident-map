<!DOCTYPE html>
<html>
<head>
    <title>Incident Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script>

var map = L.map('map').setView([-37.5,145.0],8);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}
).addTo(map);

L.marker([-37.4213067,144.9757699])
.addTo(map)
.bindPopup('Kilmore Test Incident');

</script>

</body>
</html>
