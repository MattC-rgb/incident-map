<!DOCTYPE html>
<html>
<head>
    <title>Kilmore Incident Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .popup-title {
            font-weight: bold;
            font-size: 16px;
        }

        .popup-type {
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script>

var map = L.map('map').setView([-37.5, 145.0], 8);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '© OpenStreetMap'
    }
).addTo(map);

fetch('ActiveJobs.geojson?v=' + new Date().getTime())
.then(response => response.json())
.then(data => {

    var geoLayer = L.geoJSON(data, {

        pointToLayer: function(feature, latlng) {

            var status = (feature.properties.Status || "").toLowerCase();

            var color = "blue";

            if (status === "open") {
                color = "red";
            }
            else if (status === "enroute") {
                color = "orange";
            }
            else if (status === "onscene") {
                color = "green";
            }
            else if (status === "clear") {
                color = "gray";
            }

            return L.circleMarker(latlng, {
                radius: 8,
                fillColor: color,
                color: "#000",
                weight: 1,
                opacity: 1,
                fillOpacity: 0.8
            });
        },

        onEachFeature: function(feature, layer) {

            var p = feature.properties;

            layer.bindPopup(
                '<div class="popup-title">' +
                (p.IncidentNumber || "No Incident Number") +
                '</div>' +

                '<div class="popup-type">' +
                (p.IncidentType || "") +
                '</div>' +

                '<b>Status:</b> ' + (p.Status || "") + '<br>' +
                '<b>Vehicle:</b> ' + (p.Vehicle || "") + '<br><br>' +

                '<b>Address:</b><br>' +
                (p.Address || "") + '<br><br>' +

                '<b>Opened:</b><br>' +
                (p.IncidentTime || "") + '<br><br>' +

                (p.ClearTime ?
                    '<b>Cleared:</b><br>' + p.ClearTime
                    : '')
            );
        }

    }).addTo(map);

    if (geoLayer.getLayers().length > 0) {
        map.fitBounds(geoLayer.getBounds());
    }

})
.catch(error => {
    console.error("Error loading GeoJSON:", error);
});

setTimeout(function() {
    location.reload();
}, 60000);

</script>

</body>
</html>
