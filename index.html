<!DOCTYPE html>
<html>
<head>
    <title>Kilmore Incident Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            height: 100%;
            width: 100%;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script>

var map = L.map('map').setView([-37.5, 145.0], 8);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '© OpenStreetMap'
    }
).addTo(map);

fetch('ActiveJobs.geojson')
.then(response => response.json())
.then(data => {

    var geoLayer = L.geoJSON(data, {

        pointToLayer: function(feature, latlng) {

            var status = feature.properties.Status || "";

            var color = "blue";

            if (status.toLowerCase() === "open") {
                color = "red";
            }
            else if (status.toLowerCase() === "enroute") {
                color = "orange";
            }
            else if (status.toLowerCase() === "onscene") {
                color = "green";
            }
            else if (status.toLowerCase() === "clear") {
                color = "gray";
            }

            return L.circleMarker(latlng, {
                radius: 8,
                fillColor: color,
                color: "#000",
                weight: 1,
                opacity: 1,
                fillOpacity: 0.8
            });
        },

        onEachFeature: function(feature, layer) {

            var p = feature.properties;

            layer.bindPopup(
                "<b>" + (p.IncidentNumber || "No Incident Number") + "</b><br>" +
                "Status: " + (p.Status || "") + "<br>" +
                "Vehicle: " + (p.Vehicle || "")
            );
        }

    }).addTo(map);

    map.fitBounds(geoLayer.getBounds());

})
.catch(error => {
    console.error("Error loading GeoJSON:", error);
});

</script>

</body>
</html>
