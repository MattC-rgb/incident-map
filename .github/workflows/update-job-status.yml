name: Update job status JSON

on:
  repository_dispatch:
    types: [update-job-status]

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write status JSON
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s\n' "$PAYLOAD" > job-status.json

      - name: Commit status JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add job-status.json
          git diff --cached --quiet || git commit -m "Update job status JSON"
          git push
